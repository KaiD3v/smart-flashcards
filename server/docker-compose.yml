services:
  app:
    build: .
    container_name: studyhub
    ports:
      - "3000:3000"
      - "${PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Dentro do Docker o host é o serviço `db`, não localhost.
      - DATABASE_URL=postgresql://studyhub:studyhub@db:5432/studyhub?schema=public
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: studyhub-db
    environment:
     POSTGRES_DB: studyhub
     POSTGRES_USER: studyhub
     POSTGRES_PASSWORD: studyhub
    restart: always
    ports:
      # Host 5433 evita conflito com Postgres nativo/outro serviço em localhost:5432
      - "5433:5432"
    env_file:
      - .env
    volumes:
      # Volume dedicado; se mudares o nome, o Postgres volta a correr init com POSTGRES_* abaixo.
      - studyhub_pg_data:/var/lib/postgresql/data

volumes:
  studyhub_pg_data: